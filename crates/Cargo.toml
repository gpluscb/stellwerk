[workspace]
members = ["stellwerk-api", "stellwerk-common", "stellwerk-db"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
stellwerk-common = { path = "stellwerk-common" }
stellwerk-db = { path = "stellwerk-db" }

aide = { version = "0.16.0-alpha.2", features = ["macros", "swagger", "axum", "axum-json", "axum-query", "axum-extra", "axum-extra-headers", "axum-extra-typed-routing"] }
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.6", features = ["macros"] }
axum-extra = { version = "0.12.2", features = ["typed-header", "typed-routing"] }
base64 = "0.22.1"
derive-where = { version = "1.6.0", features = ["serde"] }
headers = "0.4.1"
oauth2 = { version = "5.0.0", features = ["reqwest", "timing-resistant-secret-traits"] }
rand = "0.9.2"
rustls = "0.23.36"
schemars = { version = "1.2.0", features = ["url2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.16.1", features = ["schemars_1", "time_0_3"] }
sqlx = { version = "0.9.0-alpha.1", features = ["postgres", "runtime-tokio", "time"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde", "macros"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7.16"
toml = "0.9.11"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
twilight-http = "0.17.1"
validator = { version = "0.20.0", features = ["derive"] }
